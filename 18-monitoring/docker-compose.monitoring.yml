# Optional monitoring stack (Prometheus + Grafana) for exercise 18.
# Requires the broker from the repository root docker-compose.yml (network rabbitmq_net).
#   docker compose -f docker-compose.monitoring.yml up -d
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - rabbitmq_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true          # training only: no login
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    networks:
      - rabbitmq_net

networks:
  rabbitmq_net:
    external: true
