# Prometheus configuration for the training broker.
# Two jobs: aggregated metrics (cheap, recommended) and per-object metrics
# (one time series per queue - fine for a lab, expensive with many queues).
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: rabbitmq-per-object
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
