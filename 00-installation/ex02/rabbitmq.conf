# RabbitMQ Cluster Configuration

# Clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2  
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3

# Network and Security
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Logging
log.console = true
log.console.level = info
log.file = false

# Memory and Disk
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 2.0

# Default user (can be overridden by environment variables)
default_user = admin
default_pass = cluster123
default_vhost = /
default_user_tags.administrator = true
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Queue defaults
queue_master_locator = min-masters

# High Availability (deprecated settings removed for RabbitMQ 4.x)