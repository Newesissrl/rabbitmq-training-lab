apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq-cluster
  namespace: default
spec:
  # Number of RabbitMQ nodes (scale to 3 later in the exercise)
  replicas: 1

  # RabbitMQ image
  image: rabbitmq:4.3-management

  # Resource requirements, sized for a small training environment.
  # The operator requires memory request == limit and derives the memory
  # high watermark from it.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # Small volume for the demo environment (Killercoda provides the
  # "local-path" storage class)
  persistence:
    storage: 1Gi

  # RabbitMQ configuration
  # Note: the operator already configures Kubernetes peer discovery, the
  # management and Prometheus plugins and the default user, so they are not
  # repeated here.
  rabbitmq:
    additionalConfig: |
      # Logging
      log.console.level = info

      # Spread new queue leaders evenly across the nodes
      queue_leader_locator = balanced

  # Service configuration (in-cluster access)
  service:
    type: ClusterIP

  # Override default user
  override:
    statefulSet:
      spec:
        template:
          spec:
            containers:
            - name: rabbitmq
              env:
              - name: RABBITMQ_DEFAULT_USER
                value: "admin"
              - name: RABBITMQ_DEFAULT_PASS
                value: "killercoda123"

---
# Service for external access (NodePort for Killercoda)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-cluster-external
  namespace: default
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq-cluster
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
    nodePort: 30672
  - name: management
    port: 15672
    targetPort: 15672
    nodePort: 31672
