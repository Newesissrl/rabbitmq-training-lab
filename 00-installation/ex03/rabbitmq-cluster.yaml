apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq-cluster
  namespace: default
spec:
  # Number of RabbitMQ nodes
  replicas: 1
  
  # RabbitMQ image configuration
  image: rabbitmq:4.1.4-management
  
  # Resource requirements
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  # Disable persistence for Killercoda (demo environment)
  persistence:
    storage: 0
  
  # RabbitMQ configuration
  rabbitmq:
    # Additional configuration
    additionalConfig: |
      # Logging
      log.console = true
      log.console.level = info
      
      # Memory settings for small environments
      vm_memory_high_watermark.relative = 0.8
      disk_free_limit.relative = 1.0
      
      # Cluster settings
      cluster_formation.peer_discovery_backend = k8s
      cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
      cluster_formation.node_cleanup.interval = 30
      cluster_formation.node_cleanup.only_log_warning = true
      cluster_partition_handling = autoheal
      
      # Queue settings
      queue_master_locator = min-masters
    
    # Enable management plugin and others
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_peer_discovery_k8s
      - rabbitmq_prometheus
  
  # Service configuration
  service:
    type: ClusterIP
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  
  # Override default user
  override:
    statefulSet:
      spec:
        template:
          spec:
            containers:
            - name: rabbitmq
              env:
              - name: RABBITMQ_DEFAULT_USER
                value: "admin"
              - name: RABBITMQ_DEFAULT_PASS
                value: "killercoda123"
              # Reduce startup time for demo environment
              - name: RABBITMQ_SERVER_START_ARGS
                value: "-rabbit log_levels [{connection,info}]"
              # Resource limits for Killercoda
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

---
# Service for external access (NodePort for Killercoda)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-cluster-external
  namespace: default
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq-cluster
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
    nodePort: 30672
  - name: management
    port: 15672
    targetPort: 15672
    nodePort: 31672