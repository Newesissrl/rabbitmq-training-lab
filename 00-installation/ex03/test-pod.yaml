apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq-test
  namespace: default
  labels:
    app: rabbitmq-test
spec:
  containers:
  - name: test-container
    image: python:3.12-slim
    command: ["/bin/bash"]
    args: ["-c", "pip install --quiet pika==1.3.2 && sleep 3600"]
    env:
    - name: RABBITMQ_USERNAME
      value: "admin"
    - name: RABBITMQ_PASSWORD
      value: "killercoda123"
    - name: RABBITMQ_HOST
      value: "rabbitmq-cluster"
    - name: RABBITMQ_PORT
      value: "5672"
    # The pod is Ready only once pika is installed, so that
    # "kubectl wait --for=condition=Ready pod/rabbitmq-test" is reliable
    readinessProbe:
      exec:
        command: ["python3", "-c", "import pika"]
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  restartPolicy: Always
