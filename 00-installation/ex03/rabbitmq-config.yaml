# Merge patch for the RabbitmqCluster "rabbitmq-cluster".
# Apply with:
#   kubectl patch rabbitmqcluster rabbitmq-cluster --type merge --patch-file rabbitmq-config.yaml
#
# spec.rabbitmq.additionalConfig is plain rabbitmq.conf content: the operator
# appends it to the configuration it generates (peer discovery, default user,
# plugins...) and performs a rolling restart of the pods.
spec:
  rabbitmq:
    additionalConfig: |
      # Logging
      log.console.level = info

      # Spread new queue leaders evenly across the nodes
      queue_leader_locator = balanced

      # Make quorum the default queue type: queues declared without
      # x-queue-type become replicated quorum queues
      default_queue_type = quorum

      # Limits for a small environment
      channel_max = 2047
      connection_max = 1000
      heartbeat = 60

      # Management UI: basic message rates only
      management.rates_mode = basic
